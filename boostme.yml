services:
  db:
    image: postgres:15-alpine
    container_name: boostme_postgres_db
    restart: always
    environment:
      POSTGRES_DB: boostme_db
      POSTGRES_USER: boostme
      POSTGRES_PASSWORD: 2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boostme -d boostme_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: boostme_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./Bakend
      dockerfile: ${DOCKERFILE_BACKEND:-Dockerfile.dev}
    container_name: boostme_django_app
    # Se elimina el bucle de espera manual porque 'depends_on' con 'service_healthy' ya lo gestiona.
    # Se agregan 'migrate' y 'collectstatic' al comando de inicio.
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./Bakend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./Bakend/.env
    environment:
      - DEBUG=${DEBUG:-1}
      - POSTGRES_DB=boostme_db
      - POSTGRES_USER=boostme
      - POSTGRES_PASSWORD=2025
      - POSTGRES_HOST=db
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DISABLE_AUTO_TASKS=0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: ${DOCKERFILE_FRONTEND:-Dockerfile.dev}
    container_name: boostme_react_app
    environment:
      - DOCKER_CONTAINER=true
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

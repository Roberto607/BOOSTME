version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: boostme_postgres_db
    restart: always
    environment:
      POSTGRES_DB: boostme_db
      POSTGRES_USER: boostme
      POSTGRES_PASSWORD: "2025"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boostme -d boostme_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Bakend
      dockerfile: Dockerfile.prod
    container_name: boostme_django_app
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn Bakend.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - ./Bakend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./Bakend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    container_name: boostme_react_app
    environment:
      DOCKER_CONTAINER: "true"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

